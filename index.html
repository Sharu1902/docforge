<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DocForge — AI Documentation Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
  :root {
    --bg: #0a0a0f;
    --bg2: #111118;
    --bg3: #16161f;
    --bg4: #1c1c28;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #e8e8f0;
    --text2: #9898b0;
    --text3: #5a5a72;
    --accent: #7c6af7;
    --accent2: #5b4de0;
    --accent3: rgba(124,106,247,0.15);
    --green: #2dd4a0;
    --green2: rgba(45,212,160,0.12);
    --amber: #f59e40;
    --red: #ff5f6d;
    --cyan: #38bdf8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  /* LAYOUT */
  .app { display: flex; height: 100vh; overflow: hidden; }

  /* SIDEBAR */
  .sidebar {
    width: 240px;
    min-width: 240px;
    background: var(--bg2);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 0;
    overflow-y: auto;
    z-index: 10;
  }

  .logo {
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    width: 32px; height: 32px;
    background: var(--accent);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }

  .logo-text {
    font-size: 17px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--text);
  }

  .logo-sub {
    font-size: 10px;
    color: var(--text3);
    font-family: 'DM Mono', monospace;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .nav-section {
    padding: 16px 12px 8px;
  }

  .nav-label {
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text3);
    font-family: 'DM Mono', monospace;
    padding: 0 8px;
    margin-bottom: 6px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text2);
    margin-bottom: 2px;
    border: none;
    background: transparent;
    width: 100%;
    text-align: left;
  }

  .nav-item:hover { background: var(--bg3); color: var(--text); }
  .nav-item.active { background: var(--accent3); color: var(--accent); }

  .nav-item .icon { font-size: 15px; width: 18px; text-align: center; flex-shrink: 0; }

  .nav-item .badge {
    margin-left: auto;
    background: var(--bg4);
    color: var(--text3);
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 10px;
    min-width: 20px;
    text-align: center;
  }

  .nav-item.active .badge { background: var(--accent2); color: white; }

  .sidebar-footer {
    margin-top: auto;
    padding: 16px;
    border-top: 1px solid var(--border);
  }

  .user-chip {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 8px;
    background: var(--bg3);
    cursor: pointer;
    transition: background 0.15s;
  }

  .user-chip:hover { background: var(--bg4); }

  .avatar {
    width: 28px; height: 28px;
    background: linear-gradient(135deg, var(--accent), var(--cyan));
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
    color: white;
    flex-shrink: 0;
  }

  .user-info { flex: 1; min-width: 0; }
  .user-name { font-size: 12.5px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .user-email { font-size: 10.5px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* MAIN */
  .main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }

  /* TOP BAR */
  .topbar {
    padding: 16px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 5;
    backdrop-filter: blur(10px);
  }

  .page-title { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
  .page-sub { font-size: 12px; color: var(--text3); margin-top: 1px; }

  .topbar-actions { display: flex; gap: 10px; align-items: center; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    border: none;
    font-family: 'Syne', sans-serif;
    letter-spacing: 0.1px;
  }

  .btn-primary {
    background: var(--accent);
    color: white;
  }
  .btn-primary:hover { background: var(--accent2); transform: translateY(-1px); }

  .btn-ghost {
    background: transparent;
    color: var(--text2);
    border: 1px solid var(--border2);
  }
  .btn-ghost:hover { background: var(--bg3); color: var(--text); }

  .btn-sm { padding: 6px 12px; font-size: 12px; }

  .btn-danger { background: rgba(255,95,109,0.15); color: var(--red); border: 1px solid rgba(255,95,109,0.3); }
  .btn-danger:hover { background: rgba(255,95,109,0.25); }

  .btn-green { background: var(--green2); color: var(--green); border: 1px solid rgba(45,212,160,0.3); }
  .btn-green:hover { background: rgba(45,212,160,0.2); }

  /* PAGE CONTENT */
  .page-content { padding: 28px; flex: 1; }

  /* CARDS */
  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .card:hover { border-color: var(--border2); }

  .card-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .card-title { font-size: 14px; font-weight: 700; letter-spacing: -0.2px; }
  .card-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }

  .card-body { padding: 20px; }

  /* STATS GRID */
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }

  .stat-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s, transform 0.15s;
  }

  .stat-card:hover { border-color: var(--border2); transform: translateY(-1px); }

  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 80px; height: 80px;
    background: radial-gradient(circle, var(--glow-color, transparent) 0%, transparent 70%);
    opacity: 0.4;
  }

  .stat-icon { font-size: 22px; margin-bottom: 10px; }
  .stat-value { font-size: 28px; font-weight: 800; letter-spacing: -1px; color: var(--text); }
  .stat-label { font-size: 11px; color: var(--text3); margin-top: 3px; font-family: 'DM Mono', monospace; letter-spacing: 0.5px; }

  /* UPLOAD ZONE */
  .upload-zone {
    border: 2px dashed var(--border2);
    border-radius: 12px;
    padding: 40px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
    background: var(--bg2);
  }

  .upload-zone:hover, .upload-zone.drag-over {
    border-color: var(--accent);
    background: var(--accent3);
  }

  .upload-icon { font-size: 40px; margin-bottom: 14px; }
  .upload-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
  .upload-sub { font-size: 13px; color: var(--text3); }
  .upload-types { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }

  .type-tag {
    background: var(--bg4);
    color: var(--text3);
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid var(--border);
    letter-spacing: 0.5px;
  }

  /* PROGRESS */
  .progress-bar {
    height: 4px;
    background: var(--bg4);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 8px;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--cyan));
    border-radius: 2px;
    transition: width 0.4s ease;
    position: relative;
    overflow: hidden;
  }

  .progress-fill::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    animation: shimmer 1.5s infinite;
  }

  @keyframes shimmer { to { left: 100%; } }

  /* STATUS BADGES */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.3px;
  }

  .badge-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .badge-green { background: var(--green2); color: var(--green); }
  .badge-green .badge-dot { background: var(--green); }
  .badge-amber { background: rgba(245,158,64,0.12); color: var(--amber); }
  .badge-amber .badge-dot { background: var(--amber); animation: pulse 1.2s infinite; }
  .badge-red { background: rgba(255,95,109,0.12); color: var(--red); }
  .badge-red .badge-dot { background: var(--red); }
  .badge-gray { background: var(--bg4); color: var(--text3); }
  .badge-gray .badge-dot { background: var(--text3); }
  .badge-accent { background: var(--accent3); color: var(--accent); }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* FILES TABLE */
  .table { width: 100%; border-collapse: collapse; }
  .table th {
    text-align: left;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text3);
    padding: 10px 16px;
    font-family: 'DM Mono', monospace;
    border-bottom: 1px solid var(--border);
    font-weight: 500;
  }
  .table td {
    padding: 13px 16px;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
    color: var(--text);
  }
  .table tr:last-child td { border-bottom: none; }
  .table tr:hover td { background: rgba(255,255,255,0.02); }

  .file-name-cell { display: flex; align-items: center; gap: 10px; }
  .file-icon {
    width: 32px; height: 32px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }
  .file-icon.py { background: rgba(59,130,246,0.15); }
  .file-icon.js { background: rgba(245,158,64,0.15); }
  .file-icon.ts { background: rgba(56,189,248,0.15); }
  .file-icon.json { background: rgba(45,212,160,0.15); }
  .file-icon.yaml { background: rgba(167,139,250,0.15); }
  .file-icon.zip { background: rgba(249,115,22,0.15); }
  .file-icon.default { background: var(--bg4); }

  .file-name { font-weight: 600; font-size: 13px; }
  .file-meta { font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; }

  /* DOC VIEWER */
  .doc-sections { display: grid; gap: 16px; }

  .doc-section {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .doc-section:hover { border-color: var(--border2); }

  .doc-section-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    user-select: none;
  }

  .doc-section-icon {
    width: 28px; height: 28px;
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
  }

  .doc-section-title { font-size: 13px; font-weight: 700; flex: 1; }
  .doc-section-toggle { color: var(--text3); font-size: 12px; transition: transform 0.2s; }
  .doc-section-toggle.open { transform: rotate(90deg); }

  .doc-section-body { padding: 18px; font-size: 13.5px; line-height: 1.7; color: var(--text2); }

  .doc-section-body p { margin-bottom: 12px; }
  .doc-section-body p:last-child { margin-bottom: 0; }

  .step-list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .step-item {
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }
  .step-num {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: var(--accent3);
    color: var(--accent);
    font-size: 11px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
    font-family: 'DM Mono', monospace;
  }

  .source-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .source-chip {
    background: var(--bg4);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    color: var(--text2);
    display: flex;
    align-items: center;
    gap: 6px;
    transition: border-color 0.15s;
  }
  .source-chip:hover { border-color: var(--accent); color: var(--accent); }

  .error-list { display: flex; flex-direction: column; gap: 10px; }
  .error-item {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-left: 3px solid var(--red);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .error-name { font-size: 12.5px; font-weight: 700; color: var(--red); margin-bottom: 4px; font-family: 'DM Mono', monospace; }
  .error-desc { font-size: 12.5px; color: var(--text2); margin-bottom: 6px; }
  .error-fix { font-size: 12px; color: var(--green); display: flex; gap: 6px; align-items: flex-start; }

  .func-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .func-card {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .func-name { font-size: 12px; font-weight: 700; font-family: 'DM Mono', monospace; color: var(--cyan); margin-bottom: 4px; }
  .func-sig { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--text3); margin-bottom: 6px; }
  .func-desc { font-size: 12px; color: var(--text2); }

  /* MERMAID / DIAGRAM */
  .mermaid-container {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    overflow: auto;
    min-height: 200px;
    position: relative;
  }

  .mermaid-code {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--text2);
    white-space: pre;
    line-height: 1.6;
  }

  /* EXPORT PANEL */
  .export-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .export-card {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    gap: 14px;
    align-items: center;
  }
  .export-card:hover { border-color: var(--accent); background: var(--accent3); transform: translateY(-1px); }
  .export-icon { font-size: 24px; }
  .export-name { font-size: 14px; font-weight: 700; }
  .export-desc { font-size: 11px; color: var(--text3); margin-top: 2px; }

  /* AUTH SCREEN */
  .auth-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    position: relative;
    overflow: hidden;
  }

  .auth-bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 600px 400px at 20% 50%, rgba(124,106,247,0.12) 0%, transparent 70%),
      radial-gradient(ellipse 400px 600px at 80% 20%, rgba(56,189,248,0.07) 0%, transparent 70%),
      radial-gradient(ellipse 300px 300px at 60% 80%, rgba(45,212,160,0.06) 0%, transparent 70%);
    pointer-events: none;
  }

  .auth-grid {
    position: absolute;
    inset: 0;
    background-image: linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    mask-image: radial-gradient(ellipse 800px 600px at center, black 0%, transparent 70%);
  }

  .auth-card {
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: 20px;
    padding: 40px;
    width: 420px;
    position: relative;
    z-index: 1;
    box-shadow: 0 40px 80px rgba(0,0,0,0.4);
  }

  .auth-logo {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
    justify-content: center;
  }

  .auth-logo-icon {
    width: 40px; height: 40px;
    background: var(--accent);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }

  .auth-logo-text { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }

  .auth-title {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.5px;
    text-align: center;
    margin-bottom: 6px;
  }

  .auth-sub { font-size: 13px; color: var(--text3); text-align: center; margin-bottom: 28px; }

  .form-group { margin-bottom: 16px; }
  .form-label { font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 6px; display: block; letter-spacing: 0.3px; }

  .form-input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border2);
    border-radius: 9px;
    padding: 11px 14px;
    color: var(--text);
    font-size: 14px;
    font-family: 'Syne', sans-serif;
    outline: none;
    transition: border-color 0.15s;
  }

  .form-input:focus { border-color: var(--accent); }
  .form-input::placeholder { color: var(--text3); }

  .form-error { font-size: 11.5px; color: var(--red); margin-top: 5px; }

  .auth-divider {
    text-align: center;
    font-size: 12px;
    color: var(--text3);
    margin: 20px 0;
    position: relative;
  }
  .auth-divider::before {
    content: '';
    position: absolute;
    top: 50%; left: 0;
    width: 100%; height: 1px;
    background: var(--border);
  }
  .auth-divider span { background: var(--bg2); padding: 0 12px; position: relative; }

  /* ANALYSIS PROGRESS */
  .analysis-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }

  .analysis-card {
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: 20px;
    padding: 40px;
    width: 480px;
    text-align: center;
  }

  .analysis-spinner {
    width: 64px; height: 64px;
    border: 3px solid var(--border2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 20px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .analysis-title { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
  .analysis-step { font-size: 13px; color: var(--text3); margin-bottom: 20px; font-family: 'DM Mono', monospace; }
  .analysis-steps-list { text-align: left; display: flex; flex-direction: column; gap: 10px; }

  .a-step {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px;
    background: var(--bg3);
    border-radius: 8px;
    font-size: 12.5px;
  }
  .a-step.done { color: var(--green); }
  .a-step.active { color: var(--text); }
  .a-step.pending { color: var(--text3); }

// ─── ANTHROPIC API ───────────────────────────────────────────────────────────
async function analyzeFileWithAI(filename, content) {
  const ext = filename.split('.').pop().toLowerCase();
  const langMap = { py: 'Python', js: 'JavaScript', ts: 'TypeScript', go: 'Go', java: 'Java', yaml: 'YAML', json: 'JSON' };
  const lang = langMap[ext] || 'Unknown';

  const prompt = `You are a senior software documentation engineer. Analyze this ${lang} code/file and return documentation as a JSON object ONLY (no markdown, no backticks, just pure JSON).

File: ${filename}
Content:
${content.substring(0, 6000)}

Return this exact JSON structure:
{
  "objective": "2-3 sentence description of what this code does and its purpose",
  "workflowSteps": ["step 1", "step 2", "step 3", "step 4", "step 5"],
  "sources": ["library1 version", "library2", "service1"],
  "expectedOutput": "Description of what the code produces/returns",
  "possibleErrors": [
    {"name": "ErrorName", "desc": "When this occurs", "fix": "How to resolve it"},
    {"name": "ErrorName2", "desc": "When this occurs", "fix": "How to resolve it"}
  ],
  "functions": [
    {"name": "functionName()", "sig": "full_signature(params) -> return_type", "desc": "What it does"},
    {"name": "functionName2()", "sig": "full_signature2(params)", "desc": "What it does"}
  ],
  "architectureExplanation": "2-3 sentences on the architectural pattern and design decisions",
  "mermaidDiagram": "graph TD\\n  A[Start] --> B[Process]\\n  B --> C[End]"
}`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 1000,
      messages: [{ role: "user", content: prompt }]
    })
  });

  const data = await response.json();
  const text = data.content?.[0]?.text || '{}';
  
  try {
    const clean = text.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();
    return JSON.parse(clean);
  } catch(e) {
    // Fallback structure
    return {
      objective: `Analysis of ${filename}: ${text.substring(0, 200)}`,
      workflowSteps: ["Parse input", "Process data", "Handle errors", "Return result"],
      sources: ["Standard library"],
      expectedOutput: "Processed output based on file logic",
      possibleErrors: [{ name: "RuntimeError", desc: "General execution error", fix: "Check logs for details" }],
      functions: [],
      architectureExplanation: "Code analyzed successfully. See objective for details.",
      mermaidDiagram: "graph TD\n  A[Start] --> B[Process]\n  B --> C[End]"
    };
  }
}

  useEffect(() => {

  return (

// ─── AUTH SCREEN ──────────────────────────────────────────────────────────────
function AuthScreen({ onLogin }) {
  const [mode, setMode] = useState('login');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [name, setName] = useState('');
  const [errors, setErrors] = useState({});
  const [loading, setLoading] = useState(false);

  const validate = () => {
    const e = {};
    if (!email.includes('@')) e.email = 'Enter a valid email address';
    if (password.length < 6) e.password = 'Password must be at least 6 characters';
    if (mode === 'signup' && !name.trim()) e.name = 'Name is required';
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  const handleSubmit = async (ev) => {
    ev.preventDefault();
    if (!validate()) return;
    setLoading(true);
    await new Promise(r => setTimeout(r, 1200));
    setLoading(false);
    onLogin({ name: name || 'Alex Chen', email, initials: (name || 'Alex Chen').split(' ').map(n=>n[0]).join('').toUpperCase() });
  };

  return (
    <div className="auth-screen">
      <div className="auth-bg"/>
      <div className="auth-grid"/>
      <div className="auth-card">
        <div className="auth-logo">
          <div className="auth-logo-icon">⚡</div>
          <div>
            <div className="auth-logo-text">DocForge</div>
          </div>
        </div>

        <div className="auth-title">{mode === 'login' ? 'Welcome back' : 'Create account'}</div>
        <div className="auth-sub">{mode === 'login' ? 'Sign in to your workspace' : 'Start generating documentation instantly'}</div>

        <form onSubmit={handleSubmit}>
          {mode === 'signup' && (
            <div className="form-group">
              <label className="form-label">Full Name</label>
              <input className="form-input" placeholder="Alex Chen" value={name} onChange={e=>setName(e.target.value)}/>
              {errors.name && <div className="form-error">{errors.name}</div>}
            </div>
          )}
          <div className="form-group">
            <label className="form-label">Email Address</label>
            <input className="form-input" type="email" placeholder="you@company.com" value={email} onChange={e=>setEmail(e.target.value)}/>
            {errors.email && <div className="form-error">{errors.email}</div>}
          </div>
          <div className="form-group">
            <label className="form-label">Password</label>
            <input className="form-input" type="password" placeholder="••••••••" value={password} onChange={e=>setPassword(e.target.value)}/>
            {errors.password && <div className="form-error">{errors.password}</div>}
          </div>
          <button type="submit" className="btn btn-primary w-full" style={{justifyContent:'center', padding:'12px', fontSize:'14px'}} disabled={loading}>
            {loading ? '⏳ Authenticating…' : mode === 'login' ? '→ Sign In' : '→ Create Account'}
          </button>
        </form>

        <div className="auth-divider"><span>or</span></div>

        <div style={{textAlign:'center', fontSize:'13px', color:'var(--text3)'}}>
          {mode === 'login' ? "Don't have an account? " : "Already have an account? "}
          <span style={{color:'var(--accent)', cursor:'pointer', fontWeight:600}} onClick={() => setMode(mode==='login'?'signup':'login')}>
            {mode === 'login' ? 'Sign up free' : 'Sign in'}
          </span>
        </div>

        <div style={{marginTop:20, background:'var(--bg3)', borderRadius:10, padding:'12px 14px', fontSize:12, color:'var(--text3)', border:'1px solid var(--border)'}}>
          <strong style={{color:'var(--amber)'}}>⚡ Demo mode:</strong> Enter any email & password (6+ chars) to continue
        </div>
      </div>
    </div>
  );
}

// ─── ANALYSIS OVERLAY ────────────────────────────────────────────────────────
function AnalysisOverlay({ filename, currentStep }) {
  return (
    <div className="analysis-overlay">
      <div className="analysis-card">
        <div className="analysis-spinner"/>
        <div className="analysis-title">Analyzing your code</div>
        <div className="analysis-step" style={{marginBottom:24}}>
          {filename} · AI is reading your file…
        </div>
        <div className="analysis-steps-list">
          {ANALYSIS_STEPS.map((s, i) => {
            const done = i < currentStep;
            const active = i === currentStep;
            return (
              <div key={s.id} className={`a-step ${done?'done':active?'active':'pending'}`}>
                <span className="a-step-icon">
                  {done ? '✅' : active ? '⟳' : '○'}
                </span>
                <span>{s.label}</span>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ─── SECTION RENDERER ────────────────────────────────────────────────────────
function DocSectionCard({ icon, title, color, children }) {
  const [open, setOpen] = useState(true);
  return (
    <div className="doc-section">
      <div className="doc-section-header" onClick={() => setOpen(!open)}>
        <div className="doc-section-icon" style={{background: color + '22', color}}>{icon}</div>
        <div className="doc-section-title">{title}</div>
        <span className={`doc-section-toggle ${open ? 'open' : ''}`}>▶</span>
      </div>
      {open && <div className="doc-section-body">{children}</div>}
    </div>
  );
}

// ─── DOC VIEWER ──────────────────────────────────────────────────────────────
function DocViewer({ doc, onExport }) {
  if (!doc) return (
    <div className="empty-state">
      <div className="empty-icon">📄</div>
      <div className="empty-title">No document selected</div>
      <div className="empty-sub">Choose a document from the list to view its contents</div>
    </div>
  );

  const { sections } = doc;

  const exportDoc = (format) => {
    const s = sections;

    if (format === 'json') {
      const blob = new Blob([JSON.stringify(doc, null, 2)], {type: 'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download=`${doc.title}_docs.json`; a.click();
      URL.revokeObjectURL(url);
      onExport('JSON');

    } else if (format === 'md') {
      const md = [
        `# ${doc.title} — Documentation`,
        `> Generated by DocForge · ${doc.language} · ${formatDate(doc.createdAt)}`,
        `## Objective`,
        s.objective,
        `## Step-by-Step Workflow`,
        (s.workflowSteps||[]).map((st,i)=>`${i+1}. ${st}`).join('\n'),
        `## Sources & Dependencies`,
        (s.sources||[]).map(x=>`- \`${x}\``).join('\n'),
        `## Expected Output`,
        s.expectedOutput,
        `## Possible Errors & Fixes`,
        (s.possibleErrors||[]).map(e=>`### ${e.name}\n**Issue:** ${e.desc}\n**Fix:** ${e.fix}`).join('\n\n'),
        `## Functions & Modules`,
        (s.functions||[]).map(f=>`### \`${f.name}\`\n\`\`\`\n${f.sig}\n\`\`\`\n${f.desc}`).join('\n\n'),
        `## Architecture`,
        s.architectureExplanation,
        `## Workflow Diagram`,
        '```mermaid',
        s.mermaidDiagram,
        '```',
      ].join('\n\n');
      const blob = new Blob([md], {type: 'text/markdown'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download=`${doc.title}_docs.md`; a.click();
      URL.revokeObjectURL(url);
      onExport('Markdown');

    } else if (format === 'pdf') {
      // Build a clean print-ready HTML document and open in new tab → Save as PDF
      const errRows = (s.possibleErrors||[]).map(e=>`
        <div class="error-block">
          <div class="error-name">${e.name}</div>
          <div class="error-desc">${e.desc}</div>
          <div class="error-fix">💡 ${e.fix}</div>
        </div>`).join('');

      const funcRows = (s.functions||[]).map(f=>`
        <div class="func-card">
          <div class="func-name">${f.name}</div>
          <div class="func-sig">${f.sig}</div>
          <div class="func-desc">${f.desc}</div>
        </div>`).join('');

      const stepsHtml = (s.workflowSteps||[]).map((st,i)=>`
        <div class="step-item">
          <div class="step-num">${i+1}</div>
          <div class="step-text">${st}</div>
        </div>`).join('');

      const sourcesHtml = (s.sources||[]).map(src=>`<span class="chip">${src}</span>`).join('');

      const html = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>${doc.title} — Documentation</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Syne', sans-serif; background: #fff; color: #1a1a2e; font-size: 13px; line-height: 1.7; }
  .page { max-width: 800px; margin: 0 auto; padding: 40px 48px; }
  /* HEADER */
  .doc-header { border-bottom: 3px solid #7c6af7; padding-bottom: 20px; margin-bottom: 32px; }
  .doc-brand { font-size: 11px; font-family: 'DM Mono', monospace; color: #7c6af7; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
  .doc-title { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; color: #0a0a1f; margin-bottom: 6px; }
  .doc-meta { font-size: 11px; font-family: 'DM Mono', monospace; color: #888; }
  /* SECTIONS */
  .section { margin-bottom: 28px; break-inside: avoid; }
  .section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #eee; }
  .section-icon { width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
  .section-title { font-size: 14px; font-weight: 800; letter-spacing: -0.2px; color: #0a0a1f; }
  .section-body { color: #2c3e50; font-size: 13px; line-height: 1.75; }
  /* STEPS */
  .step-item { display: flex; gap: 12px; margin-bottom: 8px; align-items: flex-start; }
  .step-num { width: 22px; height: 22px; border-radius: 50%; background: #ede9ff; color: #7c6af7; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; font-family: 'DM Mono', monospace; }
  .step-text { color: #2c3e50; }
  /* CHIPS */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: #f4f6f8; border: 1px solid #e0e0e8; border-radius: 6px; padding: 4px 10px; font-family: 'DM Mono', monospace; font-size: 11px; color: #444; }
  /* ERRORS */
  .error-block { background: #fff5f6; border: 1px solid #ffd0d4; border-left: 3px solid #ff5f6d; border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; break-inside: avoid; }
  .error-name { font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 500; color: #d9334a; margin-bottom: 4px; }
  .error-desc { color: #555; margin-bottom: 5px; }
  .error-fix { color: #1a7a5e; font-size: 12px; }
  /* FUNCTIONS */
  .func-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .func-card { background: #f8f9fc; border: 1px solid #e8eaf0; border-radius: 8px; padding: 12px 14px; break-inside: avoid; }
  .func-name { font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500; color: #0891b2; margin-bottom: 4px; }
  .func-sig { font-family: 'DM Mono', monospace; font-size: 10px; color: #888; margin-bottom: 5px; }
  .func-desc { font-size: 12px; color: #444; }
  /* CODE BLOCK */
  .code-block { background: #1a1a2e; color: #a8d8ea; font-family: 'DM Mono', monospace; font-size: 11px; padding: 16px; border-radius: 8px; white-space: pre; overflow-x: auto; line-height: 1.6; border-left: 3px solid #7c6af7; break-inside: avoid; }
  /* FOOTER */
  .doc-footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid #eee; font-size: 11px; color: #aaa; font-family: 'DM Mono', monospace; display: flex; justify-content: space-between; }
  @media print {
    body { background: #fff; }
    .page { padding: 20px 28px; }
    .section { break-inside: avoid; }
    @page { margin: 1cm; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="doc-header">
    <div class="doc-brand">⚡ DocForge — AI Technical Documentation</div>
    <div class="doc-title">${doc.title}</div>
    <div class="doc-meta">${doc.language} &nbsp;·&nbsp; Generated ${formatDate(doc.createdAt)}</div>
  </div>

  <div class="section">
    <div class="section-header">
      <div class="section-icon" style="background:#ede9ff">🎯</div>
      <div class="section-title">Objective</div>
    </div>
    <div class="section-body">${s.objective}</div>
  </div>

  <div class="section">
    <div class="section-header">
      <div class="section-icon" style="background:#e0f7f4">🔄</div>
      <div class="section-title">Step-by-Step Workflow</div>
    </div>
    <div class="section-body">${stepsHtml}</div>
  </div>

  <div class="section">
    <div class="section-header">
      <div class="section-icon" style="background:#e0f4eb">📦</div>
      <div class="section-title">Sources & Dependencies</div>
    </div>
    <div class="section-body"><div class="chips">${sourcesHtml}</div></div>
  </div>

  <div class="section">
    <div class="section-header">
      <div class="section-icon" style="background:#e0f4eb">✅</div>
      <div class="section-title">Expected Output</div>
    </div>
    <div class="section-body">${s.expectedOutput}</div>
  </div>

  ${errRows ? `<div class="section">
    <div class="section-header">
      <div class="section-icon" style="background:#fff0f1">⚠️</div>
      <div class="section-title">Possible Errors & Fixes</div>
    </div>
    <div class="section-body">${errRows}</div>
  </div>` : ''}

  ${funcRows ? `<div class="section">
    <div class="section-header">
      <div class="section-icon" style="background:#e0f7f9">⚙️</div>
      <div class="section-title">Functions & Modules</div>
    </div>
    <div class="section-body"><div class="func-grid">${funcRows}</div></div>
  </div>` : ''}

  <div class="section">
    <div class="section-header">
      <div class="section-icon" style="background:#ede9ff">🏗️</div>
      <div class="section-title">Architecture Explanation</div>
    </div>
    <div class="section-body">${s.architectureExplanation}</div>
  </div>

  <div class="section">
    <div class="section-header">
      <div class="section-icon" style="background:#e0f4eb">📊</div>
      <div class="section-title">Workflow Diagram (Mermaid)</div>
    </div>
    <div class="section-body">
      <div class="code-block">${(s.mermaidDiagram||'').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>
      <p style="font-size:11px;color:#aaa;margin-top:8px;font-family:'DM Mono',monospace;">Paste the code above into mermaid.live to render the diagram visually.</p>
    </div>
  </div>

  <div class="doc-footer">
    <span>Generated by DocForge</span>
    <span>${doc.language} · ${doc.title}</span>
  </div>
</div>
<script>
  // Auto-trigger print dialog after fonts load
  document.fonts.ready.then(() => {
    setTimeout(() => window.print(), 300);
  });
<\/script>
</body>
</html>`;

      const printWindow = window.open('', '_blank');
      if (!printWindow) {
        alert('Pop-up blocked! Please allow pop-ups for this site, then try again.');
        return;
      }
      printWindow.document.write(html);
      printWindow.document.close();
      onExport('PDF');

    } else if (format === 'docx') {
      const s = sections;

      // Build Word XML (OOXML-compatible .docx via mhtml trick — opens natively in Word/LibreOffice)
      const esc = (str) => (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

      const stepsXml = (s.workflowSteps||[]).map((st,i) => `
        <w:p>
          <w:pPr><w:numPr><w:ilvl w:val="0"/><w:numId w:val="1"/></w:numPr></w:pPr>
          <w:r><w:t xml:space="preserve">${esc(st)}</w:t></w:r>
        </w:p>`).join('');

      const sourcesXml = (s.sources||[]).map(src => `
        <w:p>
          <w:pPr><w:numPr><w:ilvl w:val="0"/><w:numId w:val="2"/></w:numPr></w:pPr>
          <w:r><w:rPr><w:rFonts w:ascii="Courier New" w:hAnsi="Courier New"/><w:sz w:val="18"/></w:rPr><w:t>${esc(src)}</w:t></w:r>
        </w:p>`).join('');

      const errorsXml = (s.possibleErrors||[]).map(e => `
        <w:p>
          <w:r><w:rPr><w:b/><w:color w:val="C0392B"/></w:rPr><w:t>${esc(e.name)}</w:t></w:r>
        </w:p>
        <w:p><w:r><w:t xml:space="preserve">${esc(e.desc)}</w:t></w:r></w:p>
        <w:p>
          <w:r><w:rPr><w:color w:val="1A7A5E"/></w:rPr><w:t xml:space="preserve">Fix: ${esc(e.fix)}</w:t></w:r>
        </w:p>
        <w:p><w:r><w:t></w:t></w:r></w:p>`).join('');

      const funcsXml = (s.functions||[]).map(fn => `
        <w:p>
          <w:r><w:rPr><w:b/><w:rFonts w:ascii="Courier New" w:hAnsi="Courier New"/><w:color w:val="0E7490"/></w:rPr><w:t>${esc(fn.name)}</w:t></w:r>
        </w:p>
        <w:p>
          <w:r><w:rPr><w:rFonts w:ascii="Courier New" w:hAnsi="Courier New"/><w:sz w:val="18"/><w:color w:val="666666"/></w:rPr><w:t>${esc(fn.sig)}</w:t></w:r>
        </w:p>
        <w:p><w:r><w:t xml:space="preserve">${esc(fn.desc)}</w:t></w:r></w:p>
        <w:p><w:r><w:t></w:t></w:r></w:p>`).join('');

      const heading = (text, level) => `
        <w:p>
          <w:pPr>
            <w:pStyle w:val="Heading${level}"/>
            <w:spacing w:before="240" w:after="120"/>
          </w:pPr>
          <w:r><w:t>${esc(text)}</w:t></w:r>
        </w:p>`;

      const bodyPara = (text) => `
        <w:p>
          <w:pPr><w:spacing w:after="120"/></w:pPr>
          <w:r><w:t xml:space="preserve">${esc(text)}</w:t></w:r>
        </w:p>`;

      const codeBox = (text) => `
        <w:p>
          <w:pPr>
            <w:pBdr>
              <w:left w:val="single" w:sz="8" w:space="4" w:color="7C6AF7"/>
            </w:pBdr>
            <w:shd w:val="clear" w:color="auto" w:fill="1A1A2E"/>
            <w:spacing w:after="0"/>
          </w:pPr>
          <w:r>
            <w:rPr>
              <w:rFonts w:ascii="Courier New" w:hAnsi="Courier New"/>
              <w:sz w:val="18"/>
              <w:color w:val="A8D8EA"/>
            </w:rPr>
            <w:t xml:space="preserve">${esc(text)}</w:t>
          </w:r>
        </w:p>`;

      const wordXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<?mso-application progid="Word.Document"?>
<w:wordDocument xmlns:w="http://schemas.microsoft.com/office/word/2003/wordml"
  xmlns:wx="http://schemas.microsoft.com/office/word/2003/auxHint"
  xmlns:o="urn:schemas-microsoft-com:office:office"
  w:macrosPresent="no" w:embeddedObjPresent="no" w:ocxPresent="no">
  <w:styles>
    <w:style w:type="paragraph" w:styleId="Normal">
      <w:name w:val="Normal"/>
      <w:rPr>
        <w:rFonts w:ascii="Calibri" w:hAnsi="Calibri"/>
        <w:sz w:val="22"/>
        <w:color w:val="2C3E50"/>
      </w:rPr>
    </w:style>
    <w:style w:type="paragraph" w:styleId="Heading1">
      <w:name w:val="heading 1"/>
      <w:basedOn w:val="Normal"/>
      <w:rPr>
        <w:rFonts w:ascii="Calibri" w:hAnsi="Calibri"/>
        <w:b/>
        <w:sz w:val="36"/>
        <w:color w:val="1E0A5C"/>
      </w:rPr>
    </w:style>
    <w:style w:type="paragraph" w:styleId="Heading2">
      <w:name w:val="heading 2"/>
      <w:basedOn w:val="Normal"/>
      <w:rPr>
        <w:rFonts w:ascii="Calibri" w:hAnsi="Calibri"/>
        <w:b/>
        <w:sz w:val="28"/>
        <w:color w:val="7C6AF7"/>
      </w:rPr>
    </w:style>
  </w:styles>
  <w:numbering>
    <w:abstractNum w:abstractNumId="0">
      <w:lvl w:ilvl="0">
        <w:start w:val="1"/>
        <w:numFmt w:val="decimal"/>
        <w:lvlText w:val="%1."/>
        <w:lvlJc w:val="left"/>
        <w:pPr><w:ind w:left="720" w:hanging="360"/></w:pPr>
      </w:lvl>
    </w:abstractNum>
    <w:abstractNum w:abstractNumId="1">
      <w:lvl w:ilvl="0">
        <w:start w:val="1"/>
        <w:numFmt w:val="bullet"/>
        <w:lvlText w:val="&#x2022;"/>
        <w:lvlJc w:val="left"/>
        <w:pPr><w:ind w:left="720" w:hanging="360"/></w:pPr>
      </w:lvl>
    </w:abstractNum>
    <w:num w:numId="1"><w:abstractNumId w:val="0"/></w:num>
    <w:num w:numId="2"><w:abstractNumId w:val="1"/></w:num>
  </w:numbering>
  <w:body>

    <!-- Title block -->
    <w:p>
      <w:pPr><w:spacing w:after="60"/></w:pPr>
      <w:r>
        <w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri"/><w:b/><w:sz w:val="48"/><w:color w:val="1E0A5C"/></w:rPr>
        <w:t>${esc(doc.title)}</w:t>
      </w:r>
    </w:p>
    <w:p>
      <w:pPr><w:spacing w:after="20"/></w:pPr>
      <w:r>
        <w:rPr><w:rFonts w:ascii="Courier New" w:hAnsi="Courier New"/><w:sz w:val="18"/><w:color w:val="7C6AF7"/></w:rPr>
        <w:t>Generated by DocForge  ·  ${esc(doc.language)}  ·  ${esc(formatDate(doc.createdAt))}</w:t>
      </w:r>
    </w:p>
    <w:p><w:pPr><w:pBdr><w:bottom w:val="single" w:sz="6" w:space="4" w:color="7C6AF7"/></w:pBdr><w:spacing w:after="240"/></w:pPr><w:r><w:t></w:t></w:r></w:p>

    ${heading('1. Objective', 2)}
    ${bodyPara(s.objective)}

    ${heading('2. Step-by-Step Workflow', 2)}
    ${stepsXml}
    <w:p><w:r><w:t></w:t></w:r></w:p>

    ${heading('3. Sources & Dependencies', 2)}
    ${sourcesXml}
    <w:p><w:r><w:t></w:t></w:r></w:p>

    ${heading('4. Expected Output', 2)}
    ${bodyPara(s.expectedOutput)}

    ${(s.possibleErrors||[]).length > 0 ? heading('5. Possible Errors & Fixes', 2) + errorsXml : ''}

    ${(s.functions||[]).length > 0 ? heading('6. Functions & Modules', 2) + funcsXml : ''}

    ${heading('7. Architecture Explanation', 2)}
    ${bodyPara(s.architectureExplanation)}

    ${heading('8. Workflow Diagram (Mermaid)', 2)}
    ${(s.mermaidDiagram||'').split('\n').map(line => codeBox(line || ' ')).join('')}
    <w:p>
      <w:pPr><w:spacing w:before="80"/></w:pPr>
      <w:r><w:rPr><w:sz w:val="18"/><w:color w:val="999999"/></w:rPr>
        <w:t>Paste the Mermaid code above into mermaid.live to render the diagram visually.</w:t>
      </w:r>
    </w:p>

    <!-- Footer -->
    <w:p><w:pPr><w:spacing w:before="480"/><w:pBdr><w:top w:val="single" w:sz="4" w:space="4" w:color="DDDDDD"/></w:pBdr></w:pPr>
      <w:r><w:rPr><w:sz w:val="16"/><w:color w:val="AAAAAA"/></w:rPr>
        <w:t>DocForge AI Documentation Generator  ·  ${esc(doc.title)}</w:t>
      </w:r>
    </w:p>

  </w:body>
</w:wordDocument>`;

      const blob = new Blob([wordXml], {
        type: 'application/msword'
      });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${doc.title}_docs.doc`;
      a.click();
      URL.revokeObjectURL(url);
      onExport('Word');
    }
  };

  return (
    <div>
      {/* Header */}
      <div className="flex items-center justify-between mb-6">
        <div>
          <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:4}}>
            <span style={{fontSize:20}}>{getFileIcon(doc.language?.toLowerCase())}</span>
            <h2 style={{fontSize:18, fontWeight:800, letterSpacing:'-0.5px'}}>{doc.title}</h2>
            <span className="badge badge-green">✓ Analyzed</span>
          </div>
          <div style={{fontSize:12, color:'var(--text3)', fontFamily:'DM Mono, monospace'}}>
            {doc.language} · Generated {formatDate(doc.createdAt)}
          </div>
        </div>
        <div style={{display:'flex', gap:8}}>
          <button className="btn btn-ghost btn-sm" onClick={() => exportDoc('md')}>⬇ Markdown</button>

// ─── UPLOAD PAGE ─────────────────────────────────────────────────────────────
function UploadPage({ files, onUpload, onAnalyze, onDelete, onNotify }) {
  const [dragOver, setDragOver] = useState(false);
  const fileInputRef = useRef();

  const handleDrop = (e) => {
    e.preventDefault();
    setDragOver(false);
    const f = e.dataTransfer.files[0];
    if (f) processFile(f);
  };

  const processFile = (f) => {
    const allowed = ['py','js','ts','jsx','tsx','json','yaml','yml','go','java','rs','zip','txt'];
    const ext = f.name.split('.').pop().toLowerCase();
    if (!allowed.includes(ext)) {
      onNotify({ type: 'error', text: `File type .${ext} not supported` });
      return;
    }
    if (f.size > 50 * 1024 * 1024) {
      onNotify({ type: 'error', text: 'File too large (max 50 MB)' });
      return;
    }
    onUpload(f);
  };

  return (
    <div>
      {/* Upload Zone */}
      <div
        className={`upload-zone ${dragOver ? 'drag-over' : ''}`}
        onDragOver={e=>{e.preventDefault();setDragOver(true)}}
        onDragLeave={()=>setDragOver(false)}
        onDrop={handleDrop}
        onClick={() => fileInputRef.current?.click()}
        style={{marginBottom:24}}
      >
        <input ref={fileInputRef} type="file" style={{display:'none'}} onChange={e=>e.target.files[0]&&processFile(e.target.files[0])} accept=".py,.js,.ts,.jsx,.tsx,.json,.yaml,.yml,.go,.java,.rs,.zip"/>
        <div className="upload-icon">☁️</div>
        <div className="upload-title">Drop your file here</div>
        <div className="upload-sub">or click to browse · max 50 MB</div>
        <div className="upload-types">
          {['Python', 'JavaScript', 'TypeScript', 'Go', 'Java', 'YAML', 'JSON', 'ZIP'].map(t => (
            <span key={t} className="type-tag">{t}</span>
          ))}
        </div>
      </div>

      {/* Files List */}
      <div className="card">
        <div className="card-header">
          <div>
            <div className="card-title">Uploaded Files</div>
            <div className="card-sub">{files.length} files total</div>
          </div>
        </div>
        {files.length === 0 ? (
          <div className="empty-state" style={{padding:'40px 20px'}}>
            <div className="empty-icon">📭</div>
            <div className="empty-title">No files yet</div>
            <div className="empty-sub">Upload a file to get started</div>
          </div>
        ) : (
          <table className="table">
            <thead>
              <tr>
                <th>File</th>
                <th>Language</th>
                <th>Size</th>
                <th>Uploaded</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              {files.map(f => (
                <tr key={f.id}>
                  <td>
                    <div className="file-name-cell">
                      <div className={`file-icon ${f.lang}`}>{getFileIcon(f.lang)}</div>
                      <div>
                        <div className="file-name">{f.name}</div>
                        <div className="file-meta">{f.id.substring(0,8)}</div>
                      </div>
                    </div>
                  </td>
                  <td style={{color:'var(--text3)', fontFamily:'DM Mono,monospace', fontSize:12}}>.{f.lang}</td>
                  <td style={{color:'var(--text3)', fontFamily:'DM Mono,monospace', fontSize:12}}>{f.size}</td>
                  <td style={{color:'var(--text3)', fontSize:12}}>{f.uploadedAt}</td>
                  <td><StatusBadge status={f.status}/></td>
                  <td>
                    <div style={{display:'flex', gap:6, alignItems:'center'}}>
                      {f.status !== 'analyzed' ? (
                        <button className="btn btn-green btn-sm" onClick={() => onAnalyze(f)}>
                          ⚡ Analyze
                        </button>
                      ) : (
                        <span style={{fontSize:12, color:'var(--text3)'}}>✓ Done</span>
                      )}
                      <button
                        className="btn-icon"
                        title="Delete file"
                        onClick={() => onDelete('file', f)}
                      >🗑</button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

// ─── DOCS PAGE ────────────────────────────────────────────────────────────────
function DocsPage({ docs, files, onExport, onDeleteDoc, onNotify }) {
  const [selected, setSelected] = useState(docs[0] || null);
  const [search, setSearch] = useState('');

  useEffect(() => {
    if (!selected && docs.length > 0) setSelected(docs[0]);
    // If selected doc was deleted, clear it
    if (selected && !docs.find(d => d.id === selected.id)) setSelected(docs[0] || null);
  }, [docs]);

  const filtered = docs.filter(d =>
    d.title.toLowerCase().includes(search.toLowerCase()) ||
    d.language?.toLowerCase().includes(search.toLowerCase())
  );

  return (
    <div style={{display:'grid', gridTemplateColumns:'280px 1fr', gap:20, height:'calc(100vh - 120px)', overflow:'hidden'}}>
      {/* Left: Doc List */}
      <div className="card" style={{display:'flex', flexDirection:'column', overflow:'hidden'}}>
        <div className="card-header" style={{flexShrink:0}}>
          <div>
            <div className="card-title">Documents</div>
            <div className="card-sub">{docs.length} generated</div>
          </div>
        </div>
        <div style={{padding:'10px 12px', borderBottom:'1px solid var(--border)', flexShrink:0}}>
          <input
            className="form-input"
            placeholder="Search docs…"
            value={search}
            onChange={e => setSearch(e.target.value)}
            style={{padding:'7px 12px', fontSize:12}}
          />
        </div>
        <div style={{overflowY:'auto', flex:1}}>
          {filtered.length === 0 ? (
            <div className="empty-state" style={{padding:'30px 16px'}}>
              <div className="empty-sub">No documents found</div>
            </div>
          ) : filtered.map(doc => (
            <div
              key={doc.id}
              className={`doc-list-item ${selected?.id === doc.id ? 'selected' : ''}`}
              onClick={() => setSelected(doc)}
            >
              <div className="doc-list-icon">{getFileIcon(doc.language?.toLowerCase())}</div>
              <div style={{flex:1, minWidth:0}}>
                <div className="doc-list-title truncate">{doc.title}</div>
                <div className="doc-list-meta">{doc.language} · {formatDate(doc.createdAt)}</div>

                style={{flexShrink:0}}

            </div>
          ))}
        </div>
      </div>

      {/* Right: Viewer */}
      <div style={{overflowY:'auto', paddingBottom:20}}>
        <DocViewer doc={selected} onExport={(fmt) => {
          onNotify({ type: 'success', text: `${fmt} export started` });
        }}/>
      </div>
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function App() {
  const [user, setUser] = useState(null);
  const [page, setPage] = useState('dashboard');
  const [files, setFiles] = useState(SAMPLE_FILES);
  const [docs, setDocs] = useState(SAMPLE_DOCS);
  const [analyzing, setAnalyzing] = useState(false);
  const [analyzeStep, setAnalyzeStep] = useState(0);
  const [analyzeFile, setAnalyzeFile] = useState(null);
  const [notification, setNotification] = useState(null);
  const [deleteTarget, setDeleteTarget] = useState(null); // { type: 'file'|'doc', item }

  const notify = (msg) => setNotification(msg);

  const handleDeleteRequest = (type, item) => setDeleteTarget({ type, item });

  const handleDeleteConfirm = () => {
    if (!deleteTarget) return;
    const { type, item } = deleteTarget;
    if (type === 'file') {
      setFiles(prev => prev.filter(f => f.id !== item.id));
      // Also remove linked docs
      setDocs(prev => prev.filter(d => d.fileId !== item.id));
      notify({ type: 'success', text: `${item.name} and linked docs deleted` });
    } else {
      setDocs(prev => prev.filter(d => d.id !== item.id));
      notify({ type: 'success', text: `Document deleted` });
    }
    setDeleteTarget(null);
  };

  const handleUpload = (file) => {
    const ext = file.name.split('.').pop().toLowerCase();
    const newFile = {
      id: 'file_' + Date.now(),
      name: file.name,
      size: (file.size / 1024).toFixed(1) + ' KB',
      lang: ext,
      status: 'uploaded',
      uploadedAt: 'Just now',
      _rawFile: file,
    };
    setFiles(prev => [newFile, ...prev]);
    notify({ type: 'success', text: `${file.name} uploaded successfully` });
  };

  const handleAnalyze = async (file) => {
    setAnalyzeFile(file);
    setAnalyzeStep(0);
    setAnalyzing(true);

    // Mark file as processing
    setFiles(prev => prev.map(f => f.id === file.id ? {...f, status: 'processing'} : f));

    // Simulate steps
    for (let i = 0; i < ANALYSIS_STEPS.length - 1; i++) {
      await new Promise(r => setTimeout(r, 400 + Math.random() * 300));
      setAnalyzeStep(i + 1);
    }

    let sections = null;
    try {
      // Read file content if available
      let content = '# Sample file content\n# This is a demonstration\ndef main():\n    pass\n';
      if (file._rawFile) {
        content = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = e => resolve(e.target.result);
          reader.onerror = () => resolve(content);
          reader.readAsText(file._rawFile);
        });
      }
      sections = await analyzeFileWithAI(file.name, content);
    } catch (e) {
      console.error('AI error:', e);
    }

    if (!sections) {
      sections = {
        objective: `Automated analysis of ${file.name}. This file contains code that performs specific computational tasks.`,
        workflowSteps: ["Initialize module", "Load configuration", "Execute core logic", "Handle errors gracefully", "Return results"],
        sources: ["Standard library", "Core dependencies"],
        expectedOutput: "Processed result based on the file's primary function",
        possibleErrors: [{ name: "RuntimeError", desc: "Unexpected execution error", fix: "Review logs and input validation" }],
        functions: [],
        architectureExplanation: "Standard modular architecture with clear separation of concerns.",
        mermaidDiagram: "graph TD\n  A[Input] --> B[Process]\n  B --> C[Output]"
      };
    }

    const lang = { py:'Python', js:'JavaScript', ts:'TypeScript', json:'JSON', yaml:'YAML', go:'Go', java:'Java' }[file.lang] || 'Code';
    const newDoc = {
      id: 'doc_' + Date.now(),
      fileId: file.id,
      title: file.name,
      language: lang,
      createdAt: new Date().toISOString(),
      sections,
    };

    setDocs(prev => [newDoc, ...prev]);
    setFiles(prev => prev.map(f => f.id === file.id ? {...f, status: 'analyzed'} : f));
    setAnalyzing(false);
    setAnalyzeFile(null);
    notify({ type: 'success', text: `Documentation generated for ${file.name}` });
    setPage('docs');
  };

  if (!user) return <AuthScreen onLogin={setUser}/>;

  const navItems = [
    { id: 'dashboard', icon: '⊞', label: 'Dashboard' },
    { id: 'upload', icon: '⬆', label: 'Upload Files', badge: files.filter(f=>f.status==='uploaded').length || null },
    { id: 'docs', icon: '📄', label: 'Documentation', badge: docs.length },
    { id: 'settings', icon: '⚙', label: 'Settings' },
  ];

  const pageTitles = {
    dashboard: { title: 'Dashboard', sub: 'Overview of your workspace' },
    upload: { title: 'File Upload', sub: 'Upload and analyze source files' },
    docs: { title: 'Documentation', sub: 'View AI-generated documentation' },
    settings: { title: 'Settings', sub: 'Configure your workspace' },
  };

  return (
    <div className="app">
      {/* Sidebar */}
      <div className="sidebar">
        <div className="logo">
          <div className="logo-icon">⚡</div>
          <div>
            <div className="logo-text">DocForge</div>
            <div className="logo-sub">AI Docs</div>
          </div>
        </div>

        <div className="nav-section">
          <div className="nav-label">Navigation</div>
          {navItems.map(item => (
            <button
              key={item.id}
              className={`nav-item ${page === item.id ? 'active' : ''}`}
              onClick={() => setPage(item.id)}
            >
              <span className="icon">{item.icon}</span>
              <span>{item.label}</span>
              {item.badge ? <span className="badge">{item.badge}</span> : null}
            </button>
          ))}
        </div>

        <div className="nav-section" style={{marginTop:'auto'}}>
          <div className="nav-label">Quick Stats</div>
          <div style={{padding:'8px 10px', background:'var(--bg3)', borderRadius:8, fontSize:12}}>
            <div style={{display:'flex', justifyContent:'space-between', marginBottom:6}}>
              <span style={{color:'var(--text3)'}}>Files</span>
              <span style={{fontWeight:700, fontFamily:'DM Mono,monospace'}}>{files.length}</span>
            </div>
            <div style={{display:'flex', justifyContent:'space-between', marginBottom:6}}>
              <span style={{color:'var(--text3)'}}>Docs</span>
              <span style={{fontWeight:700, fontFamily:'DM Mono,monospace'}}>{docs.length}</span>
            </div>
            <div style={{display:'flex', justifyContent:'space-between'}}>
              <span style={{color:'var(--text3)'}}>API Calls</span>
              <span style={{fontWeight:700, fontFamily:'DM Mono,monospace', color:'var(--green)'}}>{docs.length}</span>
            </div>
          </div>
        </div>

        <div className="sidebar-footer">
          <div className="user-chip">
            <div className="avatar">{user.initials}</div>
            <div className="user-info">
              <div className="user-name">{user.name}</div>
              <div className="user-email">{user.email}</div>
            </div>
            <span style={{fontSize:12, cursor:'pointer', color:'var(--text3)'}} onClick={() => setUser(null)}>⏻</span>
          </div>
        </div>
      </div>

      {/* Main */}
      <div className="main">
        <div className="topbar">
          <div>
            <div className="page-title">{pageTitles[page]?.title}</div>
            <div className="page-sub">{pageTitles[page]?.sub}</div>
          </div>
          <div className="topbar-actions">
            {page === 'upload' && (
              <button className="btn btn-primary" onClick={() => document.querySelector('input[type=file]')?.click()}>
                + Upload File
              </button>
            )}
            {page === 'docs' && docs.length > 0 && (
              <span style={{fontSize:12, color:'var(--text3)'}}>
                {docs.length} document{docs.length !== 1 ? 's' : ''} generated
              </span>
            )}
          </div>
        </div>

        <div className="page-content">
          {page === 'dashboard' && <DashboardPage files={files} docs={docs} onPageChange={setPage}/>}
          {page === 'upload' && <UploadPage files={files} onUpload={handleUpload} onAnalyze={handleAnalyze} onDelete={handleDeleteRequest} onNotify={notify}/>}
          {page === 'docs' && <DocsPage docs={docs} files={files} onExport={() => {}} onDeleteDoc={(doc) => handleDeleteRequest('doc', doc)} onNotify={notify}/>}
          {page === 'settings' && <SettingsPage user={user}/>}
        </div>
      </div>

      {/* Analysis Overlay */}
      {analyzing && <AnalysisOverlay filename={analyzeFile?.name || ''} currentStep={analyzeStep}/>}

      {/* Delete Confirm Modal */}
      {deleteTarget && (
        <DeleteModal
          item={deleteTarget.item}
          type={deleteTarget.type}
          onConfirm={handleDeleteConfirm}
          onCancel={() => setDeleteTarget(null)}
        />
      )}

      {/* Notification */}
      {notification && <Notification msg={notification} onClose={() => setNotification(null)}/>}
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById('root'));
</script>
</body>
</html>
